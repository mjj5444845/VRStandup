<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Arial Unicode MS","PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F7F4EE" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="64" y="56" fill="#726A78" font-size="17" font-weight="600" text-anchor="start">PUNCHCAP / DESIGN STUDY 2026</text><text x="1536" y="56" fill="#726A78" font-size="22" font-weight="600" text-anchor="end">06</text><text x="64" y="119" fill="#292337" font-size="43" font-weight="600" text-anchor="start">花字何时出现，比画什么更重要</text><text x="64" y="166" fill="#726A78" font-size="22" font-weight="400" text-anchor="start">示意时间轴不按比例；间离窗口从“笑声开始”计时。具体数值为指南的预实验起点。</text><rect x="309" y="218" width="322" height="66" rx="10" fill="#292337" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="470.0" y="260" fill="white" font-size="25" font-weight="600" text-anchor="middle">铺垫</text><rect x="639" y="218" width="152" height="66" rx="10" fill="#F5DBDA" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="715.0" y="260" fill="#BA5059" font-size="25" font-weight="600" text-anchor="middle">停顿</text><rect x="799" y="218" width="172" height="66" rx="10" fill="#292337" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="885.0" y="260" fill="white" font-size="25" font-weight="600" text-anchor="middle">包袱</text><rect x="979" y="218" width="242" height="66" rx="10" fill="#292337" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="1100.0" y="260" fill="white" font-size="25" font-weight="600" text-anchor="middle">笑声</text><rect x="1229" y="218" width="303" height="66" rx="10" fill="#292337" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="1380.5" y="260" fill="white" font-size="25" font-weight="600" text-anchor="middle">追加包袱</text><rect x="639" y="302" width="152" height="459" rx="12" fill="#F8E4E2" stroke="#BA5059" stroke-width="2" stroke-dasharray="7 6"/><text x="715" y="348" fill="#BA5059" font-size="27" font-weight="600" text-anchor="middle">禁入</text><text x="715" y="390" fill="#BA5059" font-size="22" font-weight="400" text-anchor="middle">不新增</text><text x="715" y="424" fill="#BA5059" font-size="22" font-weight="400" text-anchor="middle">不弹跳</text><text x="715" y="458" fill="#BA5059" font-size="22" font-weight="400" text-anchor="middle">不投掷</text><text x="64" y="373" fill="#292337" font-size="29" font-weight="600" text-anchor="start">演员节奏</text><text x="64" y="408" fill="#726A78" font-size="20" font-weight="400" text-anchor="start">动作、台词与停顿</text><path d="M305,394 L1536,394" fill="none" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="64" y="523" fill="#292337" font-size="29" font-weight="600" text-anchor="start">写意</text><text x="64" y="558" fill="#726A78" font-size="20" font-weight="400" text-anchor="start">跟随比划</text><path d="M305,544 L1536,544" fill="none" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="64" y="683" fill="#292337" font-size="29" font-weight="600" text-anchor="start">间离</text><text x="64" y="718" fill="#726A78" font-size="20" font-weight="400" text-anchor="start">笑后追加评论</text><path d="M305,704 L1536,704" fill="none" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="330" y="366" fill="#292337" font-size="22" font-weight="400" text-anchor="start">铺垫 → 收手</text><text x="330" y="402" fill="#292337" font-size="22" font-weight="400" text-anchor="start">图形先退出</text><text x="829" y="384" fill="#292337" font-size="24" font-weight="600" text-anchor="start">揭示</text><path d="M975,302 L975,762" fill="none" stroke="#E67767" stroke-width="3" stroke-dasharray=""/><text x="991" y="324" fill="#E67767" font-size="23" font-weight="600" text-anchor="start">笑声起点 t₀</text><rect x="323" y="488" width="288" height="83" rx="12" fill="#E4EEEA" stroke="#477C7A" stroke-width="2" stroke-dasharray=""/><text x="467" y="522" fill="#477C7A" font-size="21" font-weight="600" text-anchor="middle">手边出现 → 跟随 → 消失</text><text x="467" y="552" fill="#477C7A" font-size="20" font-weight="400" text-anchor="middle">不把物件残留到停顿</text><rect x="807" y="488" width="152" height="83" rx="12" fill="white" stroke="#477C7A" stroke-width="2" stroke-dasharray="5 5"/><text x="883" y="523" fill="#477C7A" font-size="21" font-weight="600" text-anchor="middle">可选例外</text><text x="883" y="552" fill="#477C7A" font-size="19" font-weight="400" text-anchor="middle">需另行编排</text><rect x="1038" y="646" width="440" height="85" rx="12" fill="#FFF0CF" stroke="#F5C94C" stroke-width="2" stroke-dasharray=""/><text x="1258" y="680" fill="#292337" font-size="25" font-weight="600" text-anchor="middle">t₀ + 0.5–2 s 后触发</text><text x="1258" y="711" fill="#292337" font-size="20" font-weight="400" text-anchor="middle">未抓取：约 5 s  /  已抓取：可保留</text><path d="M975,623 L1040,623" fill="none" stroke="#E67767" stroke-width="2.5" stroke-dasharray=""/><path d="M1030,617 L1040,623 L1030,629" fill="none" stroke="#E67767" stroke-width="2.5"/><rect x="64" y="795" width="1472" height="101" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="89" y="829" fill="#292337" font-size="23" font-weight="600" text-anchor="start">编排说明</text><text x="89" y="864" fill="#726A78" font-size="23" font-weight="400" text-anchor="start">默认在停顿前清空写意；指南也允许包袱时使用写意，但不得揭底或替代本身好笑的比划。</text><path d="M64,926 L1536,926" fill="none" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="64" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="start">依据指南 p2、p4、p6–7、p9；停顿清空策略为保守提案</text><text x="1536" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="end">2D 概念提案 · 非运行界面</text></svg>