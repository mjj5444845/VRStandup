<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Arial Unicode MS","PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F7F4EE" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="64" y="56" fill="#726A78" font-size="17" font-weight="600" text-anchor="start">PUNCHCAP / DESIGN STUDY 2026</text><text x="1536" y="56" fill="#726A78" font-size="22" font-weight="600" text-anchor="end">08</text><text x="64" y="119" fill="#292337" font-size="43" font-weight="600" text-anchor="start">观众递话，演员决定是否接住</text><text x="64" y="166" fill="#726A78" font-size="22" font-weight="400" text-anchor="start">初期采用 Wizard-of-Oz：实验员依据演员规则操作；以下控制台为本轮概念布局。</text><rect x="64" y="213" width="350" height="169" rx="18" fill="white" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="88" y="250" fill="#726A78" font-size="19" font-weight="600" text-anchor="start">01</text><text x="88" y="292" fill="#292337" font-size="29" font-weight="600" text-anchor="start">抓取保留</text><text x="88" y="330" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">仅间离可进入</text><text x="88" y="360" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">后续回扔流程</text><path d="M415,297 L433,297" fill="none" stroke="#477C7A" stroke-width="2.5" stroke-dasharray=""/><path d="M423,291 L433,297 L423,303" fill="none" stroke="#477C7A" stroke-width="2.5"/><rect x="438" y="213" width="350" height="169" rx="18" fill="white" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="462" y="250" fill="#726A78" font-size="19" font-weight="600" text-anchor="start">02</text><text x="462" y="292" fill="#292337" font-size="29" font-weight="600" text-anchor="start">投向舞台</text><text x="462" y="330" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">进入待审队列</text><text x="462" y="360" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">不直接撞向演员</text><path d="M789,297 L807,297" fill="none" stroke="#477C7A" stroke-width="2.5" stroke-dasharray=""/><path d="M797,291 L807,297 L797,303" fill="none" stroke="#477C7A" stroke-width="2.5"/><rect x="812" y="213" width="350" height="169" rx="18" fill="white" stroke="#F5C94C" stroke-width="2" stroke-dasharray=""/><text x="836" y="250" fill="#726A78" font-size="19" font-weight="600" text-anchor="start">03</text><text x="836" y="292" fill="#292337" font-size="29" font-weight="600" text-anchor="start">演员筛选</text><text x="836" y="330" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">实验员代操作</text><text x="836" y="360" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">接纳 / 暂缓</text><path d="M1163,297 L1181,297" fill="none" stroke="#477C7A" stroke-width="2.5" stroke-dasharray=""/><path d="M1171,291 L1181,297 L1171,303" fill="none" stroke="#477C7A" stroke-width="2.5"/><rect x="1186" y="213" width="350" height="169" rx="18" fill="white" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="1210" y="250" fill="#726A78" font-size="19" font-weight="600" text-anchor="start">04</text><text x="1210" y="292" fill="#292337" font-size="29" font-weight="600" text-anchor="start">回应分支</text><text x="1210" y="330" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">播放预编回应</text><text x="1210" y="360" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">保留演员作者身份</text><rect x="64" y="414" width="871" height="466" rx="18" fill="#292337" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="90" y="455" fill="white" font-size="25" font-weight="600" text-anchor="start">实验员控制台 / 概念界面</text><rect x="90" y="483" width="819" height="62" rx="9" fill="#45394C" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="111" y="523" fill="#DDD2D9" font-size="23" font-weight="400" text-anchor="start">当前阶段：笑后追加</text><text x="891" y="523" fill="#DDD2D9" font-size="23" font-weight="400" text-anchor="end">舞台 0 / 2</text><rect x="90" y="560" width="397" height="183" rx="12" fill="#F7EBCF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="112" y="600" fill="#292337" font-size="21" font-weight="600" text-anchor="start">待审 01</text><text x="112" y="648" fill="#292337" font-size="38" font-weight="600" text-anchor="start">人生赢家</text><text x="112" y="698" fill="#726A78" font-size="21" font-weight="400" text-anchor="start">来源：座位 A03 · 已抓取保留</text><rect x="508" y="560" width="401" height="183" rx="12" fill="#45394C" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="530" y="599" fill="#F1E7F0" font-size="23" font-weight="400" text-anchor="start">回应分支：R-02 已准备</text><text x="530" y="645" fill="#F1E7F0" font-size="23" font-weight="400" text-anchor="start">目标：演员身侧</text><text x="530" y="691" fill="#F1E7F0" font-size="23" font-weight="400" text-anchor="start">暂缓 → 等待下一个允许时机</text><rect x="91" y="763" width="238" height="73" rx="10" fill="#F5C94C" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="210" y="809" fill="#292337" font-size="25" font-weight="600" text-anchor="middle">接纳并回应</text><rect x="347" y="763" width="238" height="73" rx="10" fill="#76677C" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="466" y="809" fill="white" font-size="25" font-weight="600" text-anchor="middle">暂缓</text><rect x="604" y="763" width="305" height="73" rx="10" fill="#B55260" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="756" y="809" fill="white" font-size="25" font-weight="600" text-anchor="middle">清空舞台</text><rect x="960" y="414" width="576" height="216" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="988" y="460" fill="#292337" font-size="28" font-weight="600" text-anchor="start">播放前的三个检查</text><text x="988" y="506" fill="#726A78" font-size="22" font-weight="400" text-anchor="start">当前不在包袱前停顿中</text><text x="988" y="548" fill="#726A78" font-size="22" font-weight="400" text-anchor="start">同屏仍有名额，且不遮挡演员</text><text x="988" y="590" fill="#726A78" font-size="22" font-weight="400" text-anchor="start">该互动已有演员确认的回应分支</text><rect x="960" y="652" width="576" height="228" rx="18" fill="#E4EEEA" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="988" y="696" fill="#477C7A" font-size="27" font-weight="600" text-anchor="start">生命周期 / 提案补充</text><text x="988" y="739" fill="#292337" font-size="22" font-weight="400" text-anchor="start">未抓取：约 5 s → 自动消失</text><text x="988" y="776" fill="#292337" font-size="22" font-weight="400" text-anchor="start">已抓取：个人保留 → 可回调</text><text x="988" y="813" fill="#292337" font-size="22" font-weight="400" text-anchor="start">暂缓：回执“已收到，稍后递话”</text><text x="988" y="850" fill="#292337" font-size="22" font-weight="400" text-anchor="start">笑声反馈：仅在控制台显示概览</text><path d="M64,926 L1536,926" fill="none" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="64" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="start">依据指南 p6–9；回执、计数器、阶段锁与反馈面板为提案补充</text><text x="1536" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="end">2D 概念提案 · 非运行界面</text></svg>