<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Arial Unicode MS","PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F7F4EE" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="64" y="56" fill="#726A78" font-size="17" font-weight="600" text-anchor="start">PUNCHCAP / DESIGN STUDY 2026</text><text x="1536" y="56" fill="#726A78" font-size="22" font-weight="600" text-anchor="end">05</text><text x="64" y="119" fill="#292337" font-size="43" font-weight="600" text-anchor="start">同一个设计空间，两套取值</text><text x="64" y="166" fill="#726A78" font-size="22" font-weight="400" text-anchor="start">把指南中的五层设计维度转为可直接讨论的视觉规格。</text><rect x="64" y="204" width="1472" height="76" rx="18" fill="#292337" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="92" y="254" fill="white" font-size="24" font-weight="600" text-anchor="start">设计层</text><text x="370" y="254" fill="white" font-size="28" font-weight="600" text-anchor="start">写意 · 数字砌末</text><text x="962" y="254" fill="white" font-size="28" font-weight="600" text-anchor="start">间离 · 数字标语牌</text><rect x="64" y="290" width="1472" height="103" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="344" y="299" width="566" height="85" rx="10" fill="#E4EEEA" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="936" y="299" width="586" height="85" rx="10" fill="#FFF0CF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="92" y="348" fill="#292337" font-size="25" font-weight="600" text-anchor="start">01 文字</text><text x="368" y="326" fill="#292337" font-size="22" font-weight="400" text-anchor="start">无字或细手写体；小于 / 等于头部</text><text x="368" y="360" fill="#292337" font-size="22" font-weight="400" text-anchor="start">中性、低饱和；不补写消息内容</text><text x="960" y="326" fill="#292337" font-size="22" font-weight="400" text-anchor="start">夸张美术字；可大于头部</text><text x="960" y="360" fill="#292337" font-size="22" font-weight="400" text-anchor="start">饱和色；允许情绪或身份反差</text><rect x="64" y="402" width="1472" height="103" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="344" y="411" width="566" height="85" rx="10" fill="#E4EEEA" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="936" y="411" width="586" height="85" rx="10" fill="#FFF0CF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="92" y="460" fill="#292337" font-size="25" font-weight="600" text-anchor="start">02 非文字</text><text x="368" y="438" fill="#292337" font-size="22" font-weight="400" text-anchor="start">局部轮廓、单色图标、少用漫符</text><text x="368" y="472" fill="#292337" font-size="22" font-weight="400" text-anchor="start">瓶口 / 绳段 / 留白手机</text><text x="960" y="438" fill="#292337" font-size="22" font-weight="400" text-anchor="start">皇冠 / 尖角气泡 / 问号</text><text x="960" y="472" fill="#292337" font-size="22" font-weight="400" text-anchor="start">公开呈现“正在评论”的装置感</text><rect x="64" y="514" width="1472" height="103" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="344" y="523" width="566" height="85" rx="10" fill="#E4EEEA" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="936" y="523" width="586" height="85" rx="10" fill="#FFF0CF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="92" y="572" fill="#292337" font-size="25" font-weight="600" text-anchor="start">03 交互</text><text x="368" y="550" fill="#292337" font-size="22" font-weight="400" text-anchor="start">只抓取查看；不投掷、不拉伸</text><text x="368" y="584" fill="#292337" font-size="22" font-weight="400" text-anchor="start">静止或淡入淡出；重量由身体表现</text><text x="960" y="550" fill="#292337" font-size="22" font-weight="400" text-anchor="start">抓取、拉伸、投掷、挂载</text><text x="960" y="584" fill="#292337" font-size="22" font-weight="400" text-anchor="start">可弹出、抖动；动效不遮脸</text><rect x="64" y="626" width="1472" height="103" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="344" y="635" width="566" height="85" rx="10" fill="#E4EEEA" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="936" y="635" width="586" height="85" rx="10" fill="#FFF0CF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="92" y="684" fill="#292337" font-size="25" font-weight="600" text-anchor="start">04 时机</text><text x="368" y="662" fill="#292337" font-size="22" font-weight="400" text-anchor="start">铺垫中跟随手势，放下即消失</text><text x="368" y="696" fill="#292337" font-size="22" font-weight="400" text-anchor="start">淡入淡出各 0.2–0.3 s，最长 5 s</text><text x="960" y="662" fill="#292337" font-size="22" font-weight="400" text-anchor="start">笑声开始后 0.5–2 s 入场</text><text x="960" y="696" fill="#292337" font-size="22" font-weight="400" text-anchor="start">未抓取约 5 s 消失；抓取后可保留</text><rect x="64" y="738" width="1472" height="103" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="344" y="747" width="566" height="85" rx="10" fill="#E4EEEA" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="936" y="747" width="586" height="85" rx="10" fill="#FFF0CF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="92" y="796" fill="#292337" font-size="25" font-weight="600" text-anchor="start">05 关系</text><text x="368" y="774" fill="#292337" font-size="22" font-weight="400" text-anchor="start">演员编排，系统执行</text><text x="368" y="808" fill="#292337" font-size="22" font-weight="400" text-anchor="start">物件锚定演员手边 0–20 cm</text><text x="960" y="774" fill="#292337" font-size="22" font-weight="400" text-anchor="start">观众可投向舞台或挂自己</text><text x="960" y="808" fill="#292337" font-size="22" font-weight="400" text-anchor="start">进入待审，由演员规则决定回应</text><text x="80" y="892" fill="#292337" font-size="23" font-weight="600" text-anchor="start">共同底线：停顿期无花字变化  /  不遮脸  /  同屏 ≤ 2 个，且写意 ≤ 1 个  /  演员保留控制权</text><path d="M64,926 L1536,926" fill="none" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="64" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="start">依据指南 p1–6、p9；版式与配色为提案补充</text><text x="1536" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="end">2D 概念提案 · 非运行界面</text></svg>