<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Arial Unicode MS","PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F7F4EE" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="64" y="56" fill="#726A78" font-size="17" font-weight="600" text-anchor="start">PUNCHCAP / DESIGN STUDY 2026</text><text x="1536" y="56" fill="#726A78" font-size="22" font-weight="600" text-anchor="end">07</text><text x="64" y="119" fill="#292337" font-size="43" font-weight="600" text-anchor="start">空间锚定：让注意力始终回到演员</text><text x="64" y="166" fill="#726A78" font-size="22" font-weight="400" text-anchor="start">正面图表达相对位置，俯视图表达交互目标；不表示最终世界坐标或可读性测试结果。</text><rect x="64" y="208" width="880" height="670" rx="18" fill="#292337" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="968" y="208" width="568" height="670" rx="18" fill="white" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="94" y="251" fill="#E3D3B8" font-size="23" font-weight="600" text-anchor="start">A / 舞台正面</text><text x="1000" y="251" fill="#292337" font-size="23" font-weight="600" text-anchor="start">B / 观众俯视</text><ellipse cx="490" cy="819" rx="134" ry="18" fill="#4C3E50"/><circle cx="490" cy="462" r="55" fill="#ECD9BD"/><path d="M440 528 Q490 506 540 528 L553 706 L424 706 Z" fill="#DBD3C7"/><path d="M438 543 L383 617 L335 600 M541 544 L596 608 L646 572" fill="none" stroke="#DBD3C7" stroke-width="24" stroke-linecap="round"/><path d="M457 704 L445 810 M520 704 L536 810" fill="none" stroke="#9A8F9D" stroke-width="30" stroke-linecap="round"/><rect x="416" y="392" width="148" height="137" rx="30" fill="none" stroke="#E67767" stroke-width="2" stroke-dasharray="7 5"/><text x="490" y="490" fill="#292337" font-size="20" font-weight="400" text-anchor="start"></text><rect x="393" y="293" width="195" height="63" rx="10" fill="#F5C94C" stroke="#292337" stroke-width="2" stroke-dasharray=""/><text x="490" y="333" fill="#292337" font-size="29" font-weight="600" text-anchor="middle">人生赢家</text><text x="659" y="327" fill="#FFF0CF" font-size="25" font-weight="600" text-anchor="start">间离：头顶 / 身侧</text><path d="M589,323 L638,323" fill="none" stroke="#F5C94C" stroke-width="2" stroke-dasharray=""/><text x="661" y="365" fill="#DDCDD9" font-size="20" font-weight="400" text-anchor="start">可大于头部，须避开脸</text><path d="M651 546 L651 521 L672 521 L672 546 M643 548 L643 568 M680 548 L680 568" fill="none" stroke="#E0EBE7" stroke-width="3" opacity="0.6"/><path d="M646,583 L686,583" fill="none" stroke="#A7C4BE" stroke-width="2" stroke-dasharray="4 3"/><text x="702" y="554" fill="#BCD8CF" font-size="23" font-weight="600" text-anchor="start">写意：手边 0–20 cm</text><text x="702" y="589" fill="#BCD8CF" font-size="19" font-weight="400" text-anchor="start">不超过演员头部大小</text><path d="M566,463 L649,444" fill="none" stroke="#E67767" stroke-width="2" stroke-dasharray=""/><text x="663" y="449" fill="#E67767" font-size="23" font-weight="600" text-anchor="start">脸部避让区</text><text x="663" y="480" fill="#DDCDD9" font-size="19" font-weight="400" text-anchor="start">随动作实时调整</text><text x="95" y="854" fill="#DDCDD9" font-size="21" font-weight="400" text-anchor="start">两模式位置对照图，不表示同时出现两个花字。</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#477C7A" stroke-width="1.5"/></marker></defs><rect x="1010" y="300" width="484" height="100" rx="12" fill="#EBE4DF" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="1252" y="361" fill="#292337" font-size="27" font-weight="600" text-anchor="middle">舞台接收区</text><circle cx="1095" cy="526" r="33" fill="#DDD6DC"/><circle cx="1095" cy="669" r="33" fill="#DDD6DC"/><circle cx="1252" cy="526" r="33" fill="#DDD6DC"/><circle cx="1252" cy="669" r="33" fill="#477C7A"/><circle cx="1409" cy="526" r="33" fill="#DDD6DC"/><circle cx="1409" cy="669" r="33" fill="#DDD6DC"/><text x="1252" y="732" fill="#477C7A" font-size="23" font-weight="600" text-anchor="middle">自己</text><path d="M1252 627 Q1330 503 1252 407" fill="none" stroke="#477C7A" stroke-width="4" marker-end="url(#a)"/><text x="1361" y="464" fill="#477C7A" font-size="21" font-weight="600" text-anchor="start">可投舞台</text><path d="M1210,669 L1130,669" fill="none" stroke="#BA5059" stroke-width="3" stroke-dasharray="5 5"/><text x="1051" y="742" fill="#BA5059" font-size="21" font-weight="600" text-anchor="start">不可挂到他人</text><rect x="1009" y="782" width="484" height="56" rx="10" fill="#E4EEEA" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="1251" y="818" fill="#477C7A" font-size="20" font-weight="600" text-anchor="middle">可挂自己 · 演员挂载由演员规则控制</text><path d="M64,926 L1536,926" fill="none" stroke="#DDD6CC" stroke-width="2" stroke-dasharray=""/><text x="64" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="start">依据指南 p4–6、p8–9；脸部避让区和接收区外形为提案</text><text x="1536" y="962" fill="#726A78" font-size="18" font-weight="400" text-anchor="end">2D 概念提案 · 非运行界面</text></svg>